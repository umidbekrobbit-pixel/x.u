<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vazifalar ro'yxati (To-Do List)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e1b4b, #312e81, #4c1d95);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }

        .container {
            background: #ffffff;
            width: 480px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .header h2 {
            font-size: 22px;
            color: #1f2937;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .counter {
            background: #ffedd5;
            color: #f97316;
            font-weight: bold;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 14px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .input-group input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            outline: none;
            font-size: 15px;
            background: #f9fafb;
            transition: border 0.3s;
        }

        .input-group input:focus {
            border-color: #f97316;
            background: #fff;
        }

        .input-group button {
            background: #f97316;
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .input-group button:hover {
            background: #ea580c;
        }

        .task-list {
            list-style: none;
            margin-bottom: 20px;
            max-height: 200px;
            overflow-y: auto;
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid #f3f4f6;
            font-size: 16px;
        }

        .task-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: #f97316;
            cursor: pointer;
        }

        .task-item.completed span {
            text-decoration: line-through;
            color: #9ca3af;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            color: #6b7280;
            border-top: 1px solid #f3f4f6;
            padding-top: 15px;
        }

        .clear-btn {
            background: none;
            border: none;
            color: #6b7280;
            cursor: pointer;
            text-decoration: underline;
            font-size: 14px;
        }

        .clear-btn:hover {
            color: #f97316;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>📁 Vazifalar ro'yxati</h2>
            <div class="counter" id="counterBadge">0/0</div>
        </div>

        <div class="input-group">
            <input type="text" id="taskInput" placeholder="Vazifangizni yozing...">
            <button id="addBtn">Qo'shish ⊕</button>
        </div>

        <ul class="task-list" id="taskList">
            <!-- Vazifalar shu yerga qo'shiladi -->
        </ul>

        <div class="footer">
            <span id="statusText">0 ta vazifadan 0 tasi bajarildi</span>
            <button class="clear-btn" id="clearBtn">Bajarilganlarni tozalash</button>
        </div>
    </div>

    <script>
        const taskInput = document.getElementById('taskInput');
        const addBtn = document.getElementById('addBtn');
        const taskList = document.getElementById('taskList');
        const counterBadge = document.getElementById('counterBadge');
        const statusText = document.getElementById('statusText');
        const clearBtn = document.getElementById('clearBtn');

        let tasks = [
            { text: "uyga vazifa", completed: true } // Rasmda ko'rsatilgan boshlang'ich holat
        ];

        function renderTasks() {
            taskList.innerHTML = '';
            let completedCount = 0;

            tasks.forEach((task, index) => {
                if (task.completed) completedCount++;

                const li = document.createElement('li');
                li.className = `task-item ${task.completed ? 'completed' : ''}`;
                
                li.innerHTML = `
                    <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${index})">
                    <span>${task.text}</span>
                `;
                taskList.appendChild(li);
            });

            counterBadge.textContent = `${completedCount}/${tasks.length}`;
            statusText.textContent = `${tasks.length} ta vazifadan ${completedCount} tasi bajarildi`;
        }

        function addTask() {
            const text = taskInput.value.trim();
            if (text !== "") {
                tasks.push({ text: text, completed: false });
                taskInput.value = '';
                renderTasks();
            }
        }

        function toggleTask(index) {
            tasks[index].completed = !tasks[index].completed;
            renderTasks();
        }

        clearBtn.addEventListener('click', () => {
            tasks = tasks.filter(task => !task.completed);
            renderTasks();
        });

        addBtn.addEventListener('click', addTask);
        taskInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addTask();
        });

        // Sahifa ochilganda dastlabki holatni chiqarish
        renderTasks();
    </script>

</body>
</html>
